name: Publish NuGet

on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#v}"
          if [[ "$VERSION" == "$TAG" && ! "$TAG" =~ ^[0-9] ]]; then
            echo "Release tag must be a semantic version such as v1.0.0 or 1.0.0."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Leap71.Semantics/Leap71.Semantics.csproj

      - name: Build
        run: dotnet build src/Leap71.Semantics/Leap71.Semantics.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack src/Leap71.Semantics/Leap71.Semantics.csproj --configuration Release --no-build --output artifacts /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
